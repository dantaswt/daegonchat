        function normalizeText(str) {

        function isTaylorsVersion(albumName) {

        }
        
        function getTaylorsVersionYear(albumName) {
            const lowerName = albumName.toLowerCase();

        function scoreAlbum(item, targetAlbum, targetArtist, targetYear) {
            let score = 0;
            const itemName = item.name;
            const itemArtist = item.artists[0]?.name || '';
            const itemYear = item.release_date ? item.release_date.split('-')[0] : null;
            const normalizedItemName = normalizeText(itemName);
            const normalizedTargetAlbum = normalizeText(targetAlbum);
            const normalizedItemArtist = normalizeText(itemArtist);
            const normalizedTargetArtist = normalizeText(targetArtist);
            if (normalizedItemArtist === normalizedTargetArtist) score += 50;
            else if (normalizedItemArtist.includes(normalizedTargetArtist) || normalizedTargetArtist.includes(normalizedItemArtist)) score += 25;
            const cleanItemName = normalizedItemName.replace(/\s*\([^)]*\)/g, '').trim();
            const cleanTargetAlbum = normalizedTargetAlbum.replace(/\s*\([^)]*\)/g, '').trim();
            if (normalizedItemName === normalizedTargetAlbum) score += 100;
            else if (cleanItemName === cleanTargetAlbum) score += 80;
            else if (cleanItemName.includes(cleanTargetAlbum) || cleanTargetAlbum.includes(cleanItemName)) score += 50;
            if (isTaylorsVersion(targetAlbum)) {
                if (itemName.toLowerCase().includes("taylor's version") || itemName.toLowerCase().includes("taylor’s version")) score += 100;
                const correctYear = getTaylorsVersionYear(targetAlbum);
                if (correctYear && itemYear === correctYear) score += 80;
                if (!itemName.toLowerCase().includes("taylor's version") && !itemName.toLowerCase().includes("taylor’s version")) score -= 50;
            }
            const albumYearFromName = extractYearFromAlbumName(itemName);
            if (targetYear && itemYear && targetYear === itemYear) score += 40;
            else if (targetYear && albumYearFromName && targetYear === albumYearFromName) score += 35;
            else if (itemYear) { const currentYear = new Date().getFullYear(); const yearDiff = currentYear - parseInt(itemYear); if (yearDiff <= 5) score += 15; else if (yearDiff <= 10) score += 5; }
            if (item.album_type === 'album') score += 20;
            else if (item.album_type === 'single') score -= 20;
            else if (item.album_type === 'compilation') score -= 10;
            if (itemName.toLowerCase().includes('deluxe')) score += 5;
            if (itemName.toLowerCase().includes('live')) score -= 30;
            if (itemName.toLowerCase().includes('remix')) score -= 25;

        }

        function setupBackToTop(){ let existing = document.querySelector('.back-to-top'); if(existing) existing.remove(); let btn = document.createElement('button'); btn.className='back-to-top'; btn.innerHTML='<i class="fas fa-arrow-up"></i>'; document.body.appendChild(btn); window.addEventListener('scroll',()=>{ if(window.scrollY>300){ btn.style.display='flex'; setTimeout(()=>btn.classList.add('visible'),10); } else{ btn.classList.remove('visible'); setTimeout(()=>{if(!btn.classList.contains('visible')) btn.style.display='none';},300); } }); btn.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'})); }
        
        async function init(){ showMessage('loading','Loading charts...'); try{ const priorityCharts = [...weeklyChartList]; await Promise.all(priorityCharts.map(ct => fetchChartData(ct))); for(let ct of weeklyChartList) { let dates = Object.keys(appState.chartData[ct]||{}); if(dates.length) { appState.sharedDate = dates[dates.length-1]; break; } } renderHome(); const backgroundCharts = [...yearEndList, ...goatList, 'artistStats', 'statsData']; backgroundCharts.forEach(ct => { fetchChartData(ct).then(() => { if (ct.includes('yearEnd') || ct.includes('goat')) updateHomeCharts(); if (ct === 'artistStats' && appState.currentView === 'allArtists') showAllArtists(); }); }); setTimeout(() => fetchChartBeat(), 500); } catch(e){ console.error(e); showMessage('error','Error loading data: '+e.message); } }
        
        document.addEventListener('DOMContentLoaded',()=>{ init(); document.getElementById('mainTitle').addEventListener('click',()=>{ appState.navigationHistory=[]; renderHome(); }); document.getElementById('navAllArtists').addEventListener('click',()=>showAllArtists()); document.getElementById('navChartBeat').addEventListener('click',()=>showChartBeat('hot100')); document.getElementById('navStats').addEventListener('click',()=>showStats()); closeModal.addEventListener('click',()=>modal.classList.remove('active')); modal.addEventListener('click',e=>{ if(e.target===modal) modal.classList.remove('active'); }); });
    </script>
</body>
</html>
